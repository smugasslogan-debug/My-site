<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Media Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #13111c;
            --bg-glow: #2a1f5c;
            --surface: #1c1929;
            --surface-2: #252135;
            --line: #37324c;
            --text: #f3f0fa;
            --muted: #a29cb8;
            --accent: #8b7bff;
            --accent-strong: #6f5cff;
            --ok: #5eead4;
            --err: #ff7a90;
            --radius: 14px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
            color: var(--text);
            background:
                radial-gradient(900px 500px at 15% -10%, var(--bg-glow), transparent 60%),
                var(--bg);
        }

        main {
            width: 100%;
            max-width: 640px;
        }

        h1 {
            font-family: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
            font-weight: 800;
            font-size: clamp(2.2rem, 7vw, 3.4rem);
            line-height: 1.02;
            letter-spacing: -0.03em;
            margin: 0 0 14px;
        }

        .lede {
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.5;
            margin: 0 0 32px;
            max-width: 46ch;
        }

        /* Link field */
        .field {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 6px 6px 6px 18px;
            transition: border-color .2s, box-shadow .2s;
        }

        .field:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(139, 123, 255, .18);
        }

        .field input {
            flex: 1;
            min-width: 0;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font: inherit;
            font-size: 1.02rem;
            padding: 12px 0;
        }

        .field input::placeholder { color: #6f6a86; }

        .ghost {
            background: var(--surface-2);
            color: var(--text);
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font: inherit;
            font-weight: 500;
            font-size: .92rem;
            cursor: pointer;
            transition: background .2s;
        }

        .ghost:hover { background: #2f2a44; }

        /* Format choice */
        .formats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
            border: none;
            padding: 0;
        }

        .format { position: relative; }

        .format input {
            position: absolute;
            opacity: 0;
            inset: 0;
            cursor: pointer;
        }

        .format span {
            display: block;
            height: 100%;
            padding: 16px 18px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            transition: border-color .2s, background .2s;
        }

        .format strong {
            display: block;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 1.25rem;
            margin-bottom: 4px;
        }

        .format small {
            color: var(--muted);
            font-size: .88rem;
            line-height: 1.35;
            display: block;
        }

        .format input:checked + span {
            border-color: var(--accent);
            background: #221e38;
        }

        .format input:focus-visible + span {
            box-shadow: 0 0 0 4px rgba(139, 123, 255, .3);
        }

        /* Main action */
        .go {
            width: 100%;
            background: var(--accent-strong);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            padding: 17px;
            font: inherit;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s, transform .1s;
        }

        .go:hover { background: #7f6dff; }
        .go:active { transform: scale(.99); }
        .go:disabled { background: #3a3550; color: #8a849f; cursor: not-allowed; }

        button:focus-visible { outline: 3px solid var(--ok); outline-offset: 3px; }

        /* Status */
        .status {
            display: none;
            margin-top: 20px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 16px 18px;
        }

        .status.show { display: block; }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .status-row button {
            display: none;
            background: none;
            border: none;
            color: var(--ok);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
        }

        .status.done .status-row button { display: inline; }

        .bar {
            height: 6px;
            background: var(--surface-2);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .bar i {
            position: absolute;
            inset: 0 auto 0 0;
            width: 35%;
            background: var(--accent);
            border-radius: 3px;
            animation: slide 1.3s ease-in-out infinite;
        }

        .status.done .bar i,
        .status.failed .bar i {
            animation: none;
            width: 100%;
        }

        .status.done .bar i { background: var(--ok); }
        .status.failed .bar i { background: var(--err); }
        .status.done #statusText { color: var(--ok); }
        .status.failed #statusText { color: var(--err); }

        @keyframes slide {
            0% { left: -35%; }
            100% { left: 100%; }
        }

        @media (max-width: 480px) {
            .formats { grid-template-columns: 1fr; }
            .ghost { padding: 10px 12px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .bar i { animation: none; width: 60%; }
            * { transition: none !important; }
        }
    </style>
</head>
<body>

<main>
    <h1>Paste a link.<br>Get the file.</h1>
    <p class="lede">Turn a YouTube video into an MP3 or an MP4 and save it straight to your computer.</p>

    <div class="field">
        <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" aria-label="YouTube link">
        <button type="button" class="ghost" id="pasteBtn">Paste</button>
    </div>

    <fieldset class="formats">
        <legend style="position:absolute;left:-9999px">Format</legend>
        <label class="format">
            <input type="radio" name="format" value="mp3" checked>
            <span><strong>MP3</strong><small>Audio only. Music, podcasts, talks.</small></span>
        </label>
        <label class="format">
            <input type="radio" name="format" value="mp4">
            <span><strong>MP4</strong><small>Video with sound. Plays on any device.</small></span>
        </label>
    </fieldset>

    <button type="button" class="go" id="convertBtn">Convert and download</button>

    <div id="statusContainer" class="status" role="status" aria-live="polite">
        <div class="status-row">
            <span id="statusText">Sending request...</span>
            <button type="button" id="saveAgain">Save again</button>
        </div>
        <div class="bar"><i></i></div>
    </div>
</main>

<script>
    const urlEl = document.getElementById('videoUrl');
    const btn = document.getElementById('convertBtn');
    const box = document.getElementById('statusContainer');
    const statusText = document.getElementById('statusText');
    const saveAgain = document.getElementById('saveAgain');

    let lastFile = null; // { url, name } for "Save again"

    function selectedFormat() {
        return document.querySelector('input[name="format"]:checked').value;
    }

    function setStatus(text, state) {
        box.className = 'status show' + (state ? ' ' + state : '');
        statusText.textContent = text;
    }

    function triggerDownload(url, name) {
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
    }

    function filenameFrom(response, format) {
        const cd = response.headers.get('Content-Disposition') || '';
        const star = cd.match(/filename\*=UTF-8''([^;]+)/i);
        if (star) {
            try { return decodeURIComponent(star[1]); } catch (e) {}
        }
        const plain = cd.match(/filename="?([^";]+)"?/i);
        return plain ? plain[1] : 'media.' + format;
    }

    async function startConversion() {
        const url = urlEl.value.trim();
        const format = selectedFormat();

        if (!url) {
            setStatus('Enter a YouTube link first.', 'failed');
            urlEl.focus();
            return;
        }

        if (lastFile) {
            URL.revokeObjectURL(lastFile.url);
            lastFile = null;
        }

        btn.disabled = true;
        setStatus('Reading video details...');

        const t1 = setTimeout(() => setStatus('Downloading the ' + format.toUpperCase() + ' stream...'), 3000);
        const t2 = setTimeout(() => setStatus('Still working. Longer videos take a while.'), 15000);

        try {
            const response = await fetch('/convert', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, format })
            });

            if (!response.ok) {
                let message = 'The conversion failed.';
                try { message = (await response.json()).error || message; } catch (e) {}
                throw new Error(message);
            }

            setStatus('Preparing your file...');
            const name = filenameFrom(response, format);
            const blob = await response.blob();
            const blobUrl = URL.createObjectURL(blob);

            lastFile = { url: blobUrl, name };
            triggerDownload(blobUrl, name);
            setStatus('Done. Saved ' + name, 'done');
        } catch (error) {
            setStatus(error.message, 'failed');
        } finally {
            clearTimeout(t1);
            clearTimeout(t2);
            btn.disabled = false;
        }
    }

    btn.addEventListener('click', startConversion);
    urlEl.addEventListener('keydown', e => { if (e.key === 'Enter') startConversion(); });
    saveAgain.addEventListener('click', () => { if (lastFile) triggerDownload(lastFile.url, lastFile.name); });

    document.getElementById('pasteBtn').addEventListener('click', async () => {
        try {
            urlEl.value = (await navigator.clipboard.readText()).trim();
            urlEl.focus();
        } catch (e) {
            urlEl.focus(); // clipboard blocked; let them paste manually
        }
    });
</script>

</body>
</html>
